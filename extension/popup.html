<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIA NHAP Zalo Importer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m12 3 1.8 5.3L19 10l-5.2 1.7L12 17l-1.8-5.3L5 10l5.2-1.7L12 3Z" />
            <path d="M5 17v4" />
            <path d="M3 19h4" />
            <path d="M19 3v4" />
            <path d="M17 5h4" />
          </svg>
        </div>
        <div class="title-block">
          <h1>Chuan hoa GIA NHAP</h1>
          <p>AI Product Sheet</p>
        </div>
        <button class="icon-button" id="refreshButton" type="button" title="Lam moi">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12a9 9 0 0 1-15.5 6.3" />
            <path d="M3 12A9 9 0 0 1 18.5 5.7" />
            <path d="M3 18h5v-5" />
            <path d="M21 6h-5v5" />
          </svg>
        </button>
      </header>

      <section class="message-list" aria-label="Trang thai">
        <article class="message assistant">
          <div class="message-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="6" y="8" width="12" height="10" rx="2" />
              <path d="M12 4v4" />
              <path d="M8 12h.01" />
              <path d="M16 12h.01" />
            </svg>
          </div>
          <div class="message-body">
            <p id="statusText">San sang nhan du lieu tu Zalo Web.</p>
          </div>
        </article>
      </section>

      <section class="composer">
        <div class="supplier-picker">
          <div class="supplier-picker-top">
            <span>Nha cung cap</span>
            <label class="supplier-search">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="7" />
                <path d="m21 21-4.3-4.3" />
              </svg>
              <input id="supplierSearch" type="search" placeholder="Tim NCC..." autocomplete="off" />
            </label>
          </div>
          <div class="supplier-chip-row" id="supplierList"></div>
        </div>

        <div class="tools-row">
          <button class="secondary-button" id="pickButton" type="button">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 3H5a2 2 0 0 0-2 2v3" />
              <path d="M16 3h3a2 2 0 0 1 2 2v3" />
              <path d="M8 21H5a2 2 0 0 1-2-2v-3" />
              <path d="M16 21h3a2 2 0 0 0 2-2v-3" />
              <path d="M7 12h10" />
            </svg>
            <span>Them doan chat</span>
          </button>
          <button class="icon-button" id="clearButton" type="button" title="Xoa noi dung">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6 18 20H6L5 6" />
            </svg>
          </button>
        </div>

        <div class="composer-row">
          <textarea id="chatText" rows="7" placeholder="Chon NCC truoc khi dan du lieu..."></textarea>
          <button class="send-button" id="sendButton" type="button">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m22 2-7 20-4-9-9-4Z" />
              <path d="M22 2 11 13" />
            </svg>
            <span>Gui</span>
          </button>
        </div>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
