<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GIA NHAP Zalo Picker</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel-header">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="2">
            <path d="m12 3 1.8 5.3L19 10l-5.2 1.7L12 17l-1.8-5.3L5 10l5.2-1.7L12 3Z" />
            <path d="M5 17v4" />
            <path d="M3 19h4" />
            <path d="M19 3v4" />
            <path d="M17 5h4" />
          </svg>
        </div>
        <div class="title-block">
          <h1>Chuan hoa GIA NHAP</h1>
          <p>Zalo chat picker</p>
        </div>
        <div class="header-actions">
          <button class="icon-button" id="refreshButton" type="button" title="Bat lai che do chon">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 0 1-15.5 6.3" />
              <path d="M3 12A9 9 0 0 1 18.5 5.7" />
              <path d="M3 18h5v-5" />
              <path d="M21 6h-5v5" />
            </svg>
          </button>
          <button class="icon-button danger" id="clearButton" type="button" title="Xoa noi dung">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M19 6 18 20H6L5 6" />
            </svg>
          </button>
        </div>
      </header>

      <section class="composer">
        <textarea id="chatText" placeholder="Bam tung doan chat lon tren Zalo Web, noi dung se tu nhay vao day..."></textarea>
        <div class="composer-actions">
          <p id="statusText">Dang san sang chon tin nhan tren Zalo Web.</p>
          <button class="copy-button" id="copyButton" type="button" disabled>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" />
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <span>Copy</span>
          </button>
        </div>
      </section>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
